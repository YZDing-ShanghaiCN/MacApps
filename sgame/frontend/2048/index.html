<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2048 · sgame</title>
    <meta name="theme-color" content="#101322" />
    <meta name="description" content="滑动合并相同数字，合成 2048。Slide and merge tiles to reach 2048." />
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css?v=0.1.1" />
    <link rel="stylesheet" href="/static/2048/2048.css?v=0.1.3" />
  </head>
  <body>
    <main class="app-shell">
      <header class="game-header">
        <a class="back-link" href="/">← 返回首页</a>
        <h1>2048</h1>
      </header>
      <section class="game-panel">
        <div class="status-bar">
          <span class="status-item">得分 SCORE <strong id="score" class="value-accent">0</strong></span>
          <span class="status-item">最高分 BEST <strong id="best" class="value-accent">0</strong></span>
          <button id="new-game-button" type="button" class="primary">新游戏 NEW</button>
        </div>
        <div class="board-wrap">
          <div id="board" class="board" aria-label="2048 棋盘">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div id="tile-layer" class="tile-layer"></div>
          </div>
          <div id="overlay" class="overlay" hidden>
            <h2 id="overlay-title"></h2>
            <p id="overlay-detail"></p>
            <div class="overlay-actions">
              <button id="overlay-continue" type="button" hidden>继续游戏 KEEP GOING</button>
              <button id="overlay-restart" type="button" class="primary">再来一局 RESTART</button>
            </div>
          </div>
        </div>
        <p class="hint">
          方向键 / WASD 移动，手机在棋盘上滑动。相同数字合并，目标合成 2048。<br />
          Arrows / WASD to move; swipe on mobile. Merge equal tiles to reach 2048.
        </p>
      </section>
    </main>
    <script src="/static/2048/2048.js?v=0.1.3"></script>
  </body>
</html>
